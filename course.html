<style>

<script>
const R0=[
{s:0,i:"🧳",t:"Careers in Cyber",tasks:[
{n:"Roles you could have",b:`<ul><li><b>SOC Analyst</b>: watches alerts and spots attacks.</li><li><b>Penetration Tester</b>: paid to hack, with permission.</li><li><b>Security Engineer</b>: builds and fixes defences.</li><li><b>Incident Responder</b>: handles a breach as it happens.</li></ul>`,q:[["Which role is paid to hack systems with permission?",["penetration tester","pentester","pen tester"]],["Which role monitors alerts in a security operations centre?",["soc analyst","analyst","security analyst"]]]},
{n:"Red team vs blue team",b:`<p>The <b>red team</b> plays the attacker to test defences. The <b>blue team</b> defends and detects. Together (sometimes called <b>purple</b>) they make an organisation stronger.</p>`,q:[["Which team defends?",["blue","blue team"]]]}]},
{s:0,i:"🔐",t:"What is Cyber Security?",tasks:[
{n:"The CIA triad",b:`<p>Security protects <b>C</b>onfidentiality (only the right people see data), <b>I</b>ntegrity (data isn't secretly changed) and <b>A</b>vailability (systems work when needed). Ransomware attacks availability; a data leak attacks confidentiality.</p><div class="tip">⚠️ Only test systems you own or have written permission to test.</div>`,q:[["What does the C in CIA stand for?",["confidentiality"]],["Ransomware mainly breaks which property?",["availability"]],["Do you need permission before testing a system? (yes/no)",["yes"]]]}]},
{s:1,i:"🖥️",t:"Inside a Computer System",tasks:[
{n:"The main parts",b:`<div class="tw"><table><tr><th>Part</th><th>Job</th></tr><tr><td>CPU</td><td>The brain; runs instructions</td></tr><tr><td>RAM</td><td>Short-term memory; cleared when power is off</td></tr><tr><td>Storage (SSD/HDD)</td><td>Long-term memory for files</td></tr><tr><td>Operating system</td><td>Software that manages the hardware and apps</td></tr></table></div>`,q:[["Which component is the brain of the computer?",["cpu","processor"]],["Which is cleared when power is off, RAM or storage?",["ram"]],["What software manages the hardware (Windows, Linux...)?",["operating system","os"]]]}]},
{s:1,i:"📱",t:"Computer Types",tasks:[
{n:"Not just laptops",b:`<p>Computers come as desktops and laptops, phones, <b>servers</b>, network gear like <b>routers</b> (which forward traffic between networks), and <b>IoT</b> devices such as smart cameras and thermostats. IoT devices are often forgotten and never updated, which makes them popular targets.</p>`,q:[["What does IoT stand for? (three words)",["internet of things"]],["Which device forwards traffic between networks?",["router"]]]}]},
{s:1,i:"🔄",t:"Client-Server Basics",tasks:[
{n:"Asking and answering",b:`<p>A <b>client</b> (your browser or app) sends a <b>request</b>; a <b>server</b> sends back a <b>response</b>. Web servers deliver pages, mail servers handle email, and database servers store data. Attackers usually target servers because they hold valuable data for many people.</p>`,q:[["Which side sends the request, client or server?",["client"]],["What type of server stores an app's data?",["database","database server"]]]}]},
{s:1,i:"🧊",t:"Virtualisation Basics",tasks:[
{n:"A computer inside a computer",b:`<p>A <b>virtual machine (VM)</b> is a pretend computer running inside your real one. A <b>hypervisor</b> (VirtualBox, VMware) creates and runs VMs. A <b>snapshot</b> saves a VM's state so you can roll back if you break something. That's why VMs are the safest place to practise hacking.</p>`,q:[["What software creates and runs VMs?",["hypervisor"]],["What feature saves a VM's state so you can roll back?",["snapshot"]]]}]},
{s:1,i:"☁️",t:"Cloud Computing Fundamentals",tasks:[
{n:"Renting computers",b:`<p>Cloud means renting computing from a provider (AWS, Azure, Google Cloud) instead of owning hardware. <b>IaaS</b> rents servers, <b>PaaS</b> rents a platform to run code, <b>SaaS</b> is finished software like Gmail. Under <b>shared responsibility</b>, the provider secures the hardware and you secure your settings and data.</p>`,q:[["What do we call finished software delivered online (Gmail)? Use the 4-letter short form.",["saas"]],["Who must configure who can access your cloud storage: you or the provider?",["you","the customer","customer"]]]}]},
{s:2,i:"🌐",t:"Networking Basics",tasks:[
{n:"IPs, DNS and ports",b:`<p>Every device has an <b>IP address</b> (IPv4 is 32 bits, like <code>192.168.1.10</code>). <b>DNS</b> is the phone book turning names into IPs. A <b>port</b> is a numbered door for one service: 22 = SSH, 80 = HTTP, 443 = HTTPS. <code>127.0.0.1</code> means "this computer".</p>`,q:[["How many bits is an IPv4 address?",["32"]],["Which system turns domain names into IPs?",["dns"]],["Default port for HTTPS?",["443"]]]}]},
{s:2,i:"🐧",t:"Linux in Your Browser",tasks:[
{n:"Capture the flag",b:`<p>Try the commands: <code>help</code>, <code>pwd</code>, <code>ls</code>, <code>cd docs</code>, <code>cd ..</code>, <code>cat file</code>, <code>whoami</code>.</p><div class="term" data-term></div><p>Read <code>flag.txt</code> in your home folder, then look inside <code>docs</code>.</p>`,q:[["What is the flag in flag.txt?",["flag{first_steps_done}"]],["What is the hidden word in the docs folder?",["lighthouse"]]]}]},
{s:3,i:"🔑",t:"Passwords & Phishing",tasks:[
{n:"Protect your accounts",b:`<p>Reuse is the biggest password risk; use a <b>password manager</b> and turn on <b>MFA</b> (multi-factor authentication). Sites store a one-way <b>hash</b> plus a random <b>salt</b>, not your password. <b>Phishing</b> is a fake message pretending to be someone trusted; watch for urgency, odd senders and mismatched links.</p>`,q:[["Can a good hash be reversed? (yes/no)",["no"]],["What random data is added before hashing?",["salt"]],["What is a fake email impersonating a trusted source called?",["phishing"]]]}]}];
const SEC=["Introduction to Cyber","Computer Fundamentals","Operating Systems Basics","Software Basics","Network Fundamentals","How The Web Works","Attacks and Defenses"];
const T=(s,i,t,n,b,q)=>({s,i,t,tasks:[{n,b,q}]});
const M=Object.fromEntries(R0.map(r=>[r.t,r]));
const X=(o,s,t,i)=>({...M[o],s,t,i:i||M[o].i});
const R=[
M["Careers in Cyber"],M["What is Cyber Security?"],
M["Inside a Computer System"],M["Computer Types"],M["Client-Server Basics"],M["Virtualisation Basics"],M["Cloud Computing Fundamentals"],
T(2,"💽","Operating Systems: Introduction","What does an OS do?",`<p>An <b>operating system</b> manages hardware, files, programs and users. Examples: Windows, macOS, Linux, Android. Its core is the <b>kernel</b>, which talks directly to the hardware. Linux is open source; Windows is not.</p>`,[["What is the core part of an OS called?",["kernel"]],["Which is open source, Windows or Linux?",["linux"]]]),
T(2,"🪟","Windows Basics","Finding your way",`<p>Windows uses <b>File Explorer</b> for files, <b>Settings</b> for configuration and <b>Task Manager</b> (Ctrl+Shift+Esc) to see running programs. The main drive is <code>C:\\</code>. Settings are stored in the <b>Registry</b>. The <b>Administrator</b> account has full control.</p>`,[["Which tool shows running processes (Ctrl+Shift+Esc)?",["task manager"]],["What letter is the main Windows drive?",["c","c:"]]]),
X("Linux in Your Browser",2,"Linux CLI Basics","🐧"),
T(2,"🪄","Windows CLI Basics","Command Prompt",`<pre>dir        list files
cd folder  change directory
type f.txt show a file
ipconfig   show network settings
whoami     current user
tasklist   running programs</pre><p><b>PowerShell</b> is a more powerful Windows shell.</p>`,[["Which command lists files in Command Prompt?",["dir"]],["Which command shows your IP configuration?",["ipconfig"]]]),
T(2,"🔑","Operating System Security","Hardening an OS",`<p>Key defences: install <b>patches</b> (updates that fix vulnerabilities), use <b>least privilege</b> (no daily admin use), keep a <b>firewall</b> on, run antivirus, and encrypt the disk so stolen laptops stay unreadable.</p>`,[["Fixes released for vulnerabilities are called ...?",["patches","patch","updates","update"]],["What blocks unwanted network traffic?",["firewall"]]]),
T(3,"🔢","Data Representation","Bits, bytes and hex",`<p>Computers store everything as <b>binary</b> (0 and 1). One <b>bit</b> is a 0 or 1; <b>8 bits = 1 byte</b>. <b>Hexadecimal</b> is base 16 (0-9, A-F) and is a shorter way to write bytes. Binary <code>101</code> = 5. <b>ASCII</b> maps numbers to letters (A = 65).</p>`,[["How many bits are in a byte?",["8"]],["What is binary 101 in decimal?",["5"]],["Hexadecimal is base what?",["16"]]]),
T(3,"🧩","Data Encoding","Encoding is not encryption",`<p><b>Encoding</b> changes data's format so systems can handle it. <b>Base64</b> turns bytes into plain text; <b>URL encoding</b> writes a space as <code>%20</code>. There is no key, so anyone can decode it. Never treat encoding as protection.</p>`,[["Is Base64 encryption? (yes/no)",["no"]],["How is a space written in URL encoding?",["%20"]]]),
T(3,"🐍","Python: Simple Demo","Your first script",`<pre>name = "hacker"
for i in range(3):
    print("Hello", name)</pre><p>Python is popular in security for automating tasks. <code>print()</code> shows output; <code>range(3)</code> repeats 3 times.</p>`,[["Which function displays output in Python?",["print","print()"]],["How many times does the loop above run?",["3"]]]),
T(3,"🟨","JavaScript: Simple Demo","Code in the browser",`<p>JavaScript runs inside your browser and makes pages interactive. Press F12 to open <b>Developer Tools</b> and try <code>console.log("hi")</code>. Attackers abuse JavaScript in XSS attacks.</p>`,[["Which JS function prints to the console?",["console.log","console.log()"]],["Which key opens browser Developer Tools?",["f12"]]]),
T(3,"🗄️","Database SQL Basics","Talking to databases",`<p>Databases store data in <b>tables</b> (rows and columns). <b>SQL</b> is the language to query them:</p><pre>SELECT * FROM users WHERE name='admin';</pre><p>Unsafe input in queries causes SQL injection.</p>`,[["Which SQL command reads data?",["select"]],["What does SQL stand for?",["structured query language"]]]),
X("Networking Basics",4,"What is Networking?","🌐"),
T(4,"🏠","Intro to LAN","Local networks",`<p>A <b>LAN</b> is a local network (home, office). A <b>switch</b> connects devices inside it; a <b>router</b> links the LAN to the internet. Home LANs use private IPs like <code>192.168.x.x</code>, handed out automatically by <b>DHCP</b>.</p>`,[["Which device connects your LAN to the internet?",["router"]],["Which protocol assigns IPs automatically?",["dhcp"]]]),
T(4,"📚","OSI Model","Seven layers",`<p>1 Physical, 2 Data Link, 3 Network, 4 Transport, 5 Session, 6 Presentation, 7 Application. Memory aid: "Please Do Not Throw Sausage Pizza Away". IP addresses live at layer 3; HTTP lives at layer 7.</p>`,[["How many layers does the OSI model have?",["7","seven"]],["Which layer do IP addresses belong to?",["network","3","layer 3"]]]),
T(4,"📦","Packets & Frames","How data travels",`<p>Data is split into <b>packets</b> with a header (source and destination IP) and a payload. At layer 2 they are wrapped as <b>frames</b> using MAC addresses. <b>TCP</b> opens a connection with a three-way handshake: SYN, SYN-ACK, ACK.</p>`,[["Which flag starts a TCP handshake?",["syn"]],["What is a layer 2 unit of data called?",["frame","frames"]]]),
T(4,"🔥","Extending Your Network","Firewalls, VPNs and more",`<p>A <b>firewall</b> filters traffic by rules. A <b>VPN</b> creates an encrypted tunnel across the internet. <b>Port forwarding</b> exposes an internal service to the outside, which is convenient but risky.</p>`,[["Which tool encrypts traffic through a tunnel?",["vpn"]],["Which device filters traffic by rules?",["firewall"]]]),
T(5,"📖","DNS in Detail","How a lookup works",`<p>Your device asks a <b>resolver</b>, which asks the root servers, then the <b>TLD</b> servers (.com), then the domain's authoritative server. Record types: <b>A</b> (IPv4), <b>AAAA</b> (IPv6), <b>MX</b> (mail), <b>CNAME</b> (alias).</p>`,[["Which record type maps a name to an IPv4 address?",["a"]],["Which record type points to mail servers?",["mx"]]]),
T(5,"📨","HTTP in Detail","Requests and responses",`<p>A request has a method, path, headers and optional body. Methods: GET, POST, PUT, DELETE. Status classes: <b>2xx</b> success, <b>3xx</b> redirect, <b>4xx</b> client error, <b>5xx</b> server error.</p>`,[["Which status class means server error?",["5xx","500"]],["Which method removes a resource?",["delete"]]]),
T(5,"🧱","How Websites Work","Front end and back end",`<p><b>HTML</b> gives a page its structure, <b>CSS</b> its style and <b>JavaScript</b> its behaviour; these run in your browser (the <b>front end</b>). Code on the server that handles logins and data is the <b>back end</b>.</p>`,[["Which language structures a web page?",["html"]],["Code running on the server is called the ... end?",["back","back end","backend"]]]),
T(5,"🧩","Putting it all together","What happens when you visit a site",`<p>1) Browser does a <b>DNS lookup</b>. 2) TCP handshake. 3) <b>HTTPS</b> encryption is set up. 4) Browser sends an HTTP <code>GET</code>. 5) Server responds. 6) Browser renders the page.</p>`,[["What happens first, DNS lookup or HTTP request?",["dns","dns lookup"]],["Which protocol encrypts web traffic?",["https"]]]),
T(6,"🔺","The CIA Triad","Confidentiality, Integrity, Availability",`<p>Encryption protects <b>confidentiality</b>. Hashes and digital signatures protect <b>integrity</b>. Backups and redundancy protect <b>availability</b>. A DDoS flood attacks availability.</p>`,[["Hash checks mainly protect which property?",["integrity"]],["A DDoS attack targets which property?",["availability"]]]),
T(6,"🗝️","Cryptography Concepts","Keys and hashes",`<p><b>Symmetric</b> encryption uses one shared key (AES). <b>Asymmetric</b> uses a public/private key pair (RSA). <b>Hashing</b> (SHA-256) is one-way and used to check integrity and store passwords.</p>`,[["Which type uses a public and private key pair?",["asymmetric"]],["Which crypto concept is one-way?",["hashing","hash"]]]),
T(6,"🕵️","Become a Hacker","The attacker's steps",`<p>Typical phases: <b>reconnaissance</b> (gather info), scanning (e.g. <b>Nmap</b> finds open ports), gaining access, then reporting. Ethical hackers do this only with written permission.</p>`,[["What is the first phase called?",["reconnaissance","recon"]],["Which tool scans for open ports?",["nmap"]]]),
X("Passwords & Phishing",6,"Become a Defender","🛡️")];
const ad=(t,n,b,q)=>R.find(r=>r.t==t).tasks.push({n,b,q});
ad("Careers in Cyber","Skills and getting started",`<p>Useful skills: curiosity, networking basics, Linux, a little scripting and clear writing. Practise in <b>CTFs</b> (Capture The Flag games) and home labs. A common entry certification is <b>CompTIA Security+</b>.</p>`,[["What does CTF stand for? (three words)",["capture the flag"]],["Which CompTIA certification is a common entry point?",["security+","comptia security+"]]]);
ad("What is Cyber Security?","Threat actors and attack surface",`<p>Attackers include script kiddies, criminals, hacktivists, nation states and <b>insiders</b> (people who misuse legitimate access). The <b>attack surface</b> is every possible way into a system: open ports, apps, people, devices.</p>`,[["Who misuses legitimate access from inside an organisation?",["insider","insiders","insider threat"]],["All the possible entry points together are the ...?",["attack surface"]]]);
ad("Inside a Computer System","Booting up",`<p>The <b>motherboard</b> connects every part. When you press power, firmware called <b>BIOS/UEFI</b> checks the hardware and then hands control to the OS. A <b>GPU</b> handles graphics and heavy parallel maths (also used for password cracking).</p>`,[["Which firmware starts the hardware before the OS loads?",["bios","uefi","bios/uefi"]],["What does GPU stand for?",["graphics processing unit"]]]);
ad("Computer Types","Servers and embedded systems",`<p><b>Servers</b> run around the clock serving other computers. <b>Embedded systems</b> are tiny computers inside machines (cars, ATMs, printers) and often get few updates. <b>Mobile devices</b> hold personal data, so they are valuable targets.</p>`,[["Which computers run 24/7 serving others?",["server","servers"]],["A computer built inside a machine, like a car, is called ...?",["embedded","embedded system"]]]);
ad("Client-Server Basics","Anatomy of a URL",`<p><code>https://example.com/login</code> has a <b>protocol</b> (https), a <b>domain</b> (example.com) and a <b>path</b> (/login). The server decides what to send back for each path.</p>`,[["In that URL, what is /login called?",["path"]],["What is the 'https' part called?",["protocol","scheme"]]]);
ad("Virtualisation Basics","Why hackers love VMs",`<p>The real computer is the <b>host</b>; each VM is a <b>guest</b>. VMs let you attack deliberately vulnerable machines safely. A <b>host-only</b> network keeps a VM away from the internet, so malware you study can't get out.</p>`,[["What is the real computer running the VMs called?",["host","host machine"]],["Which network mode keeps a VM isolated from the internet?",["host-only","host only"]]]);
ad("Cloud Computing Fundamentals","Common cloud mistakes",`<p>Most cloud breaches come from <b>misconfiguration</b>: publicly readable storage, weak access keys, or credentials accidentally posted in code. AWS file storage containers are called <b>S3 buckets</b>.</p>`,[["What are AWS S3 storage containers called?",["bucket","buckets","s3 bucket","s3 buckets"]],["Most cloud breaches come from ... (one word)?",["misconfiguration","misconfigurations"]]]);
ad("Operating Systems: Introduction","Processes, files and users",`<p>A <b>process</b> is a running program. Files live in a tree of folders, each with an owner and permissions. On Linux the all-powerful account is <b>root</b>; on Windows it is Administrator.</p>`,[["What is a running instance of a program called?",["process"]],["Which Linux account has full control?",["root"]]]);
ad("Windows Basics","Users, services and UAC",`<p><b>Services</b> are programs that run in the background (printing, updates). <b>UAC</b> (User Account Control) asks for confirmation before admin-level changes, which blocks many silent malware installs.</p>`,[["Programs that run in the background are called ...?",["services","service"]],["What does the UAC prompt stand for?",["user account control"]]]);
ad("Linux CLI Basics","Flags, pipes and help",`<pre>ls -la          list all files, detailed
man ls          read the manual
grep admin f    search text in a file
cat f | grep x  pipe output into another command</pre>`,[["Which command opens a command's manual?",["man"]],["Which command searches for text in files?",["grep"]]]);
ad("Windows CLI Basics","PowerShell",`<p>PowerShell commands (<b>cmdlets</b>) follow a <code>Verb-Noun</code> pattern: <code>Get-Process</code>, <code>Get-ChildItem</code> (list files), <code>Get-Help</code>.</p>`,[["Which cmdlet lists running processes?",["get-process"]],["PowerShell cmdlets are named Verb- and what?",["noun"]]]);
ad("Operating System Security","Accounts and logs",`<p>Use a <b>standard user</b> account day to day and admin only when needed. Lock your screen, use MFA, and keep <b>logs</b>: records of events that investigators read after an incident.</p>`,[["Which account type should you use day to day?",["standard","standard user"]],["Records of system events are called ...?",["logs","log"]]]);
ad("Data Representation","Converting numbers",`<p>Binary place values: 8 4 2 1. So <code>1101</code> = 8+4+1 = 13. In hex, A=10 ... F=15, and <code>FF</code> = 255 (the largest byte).</p>`,[["What is binary 1101 in decimal?",["13"]],["What is hex FF in decimal?",["255"]]]);
ad("Data Encoding","Spotting Base64",`<p>Base64 text uses letters, digits, + and /, and often ends with <code>=</code> padding. For example <code>aGk=</code> decodes to a short greeting.</p>`,[["What does aGk= decode to?",["hi"]],["Which character commonly pads Base64?",["="]]]);
ad("Python: Simple Demo","Decisions",`<pre>port = 22
if port == 22:
    print("SSH")  # a comment</pre><p><code>if</code> makes a decision; <code>#</code> starts a comment.</p>`,[["What does the code print?",["ssh"]],["Which symbol starts a Python comment?",["#"]]]);

ad("What is Networking?","Network types and devices",`<p>A <b>LAN</b> is local, a <b>WAN</b> covers large areas, and the internet is the biggest WAN. A <b>NIC</b> (network interface card) connects a computer to a network; <b>switches</b> and <b>routers</b> move the traffic.</p>`,[["Which network type covers a large area?",["wan"]],["Which hardware connects a computer to a network?",["nic","network interface card"]]]);

ad("OSI Model","Layers in action",`<p>Sending data wraps it with a new header at each layer going down: <b>encapsulation</b>. The receiver unwraps it going up: decapsulation. TCP and UDP live at the <b>Transport</b> layer (4).</p>`,[["What is wrapping data with headers called?",["encapsulation"]],["Which layer do TCP and UDP belong to?",["transport","4","layer 4"]]]);

ad("Extending Your Network","NAT",`<p><b>NAT</b> lets many private devices share one public IP address; your router keeps a table of who asked for what. It hides internal addresses but is not a firewall.</p>`,[["What does NAT stand for?",["network address translation"]],["Is NAT a replacement for a firewall? (yes/no)",["no"]]]);
ad("DNS in Detail","Caching and spoofing",`<p>Answers are cached for a time called the <b>TTL</b> (time to live). Attackers try <b>DNS spoofing</b> (cache poisoning): feeding fake answers so you land on a malicious site.</p>`,[["How long a DNS answer is cached is set by the ...?",["ttl"]],["Feeding fake DNS answers is called DNS ...?",["spoofing","poisoning","cache poisoning"]]]);
ad("HTTP in Detail","Headers and cookies",`<p>Headers carry extra information: <code>Host</code>, <code>User-Agent</code> (your browser), <code>Cookie</code>. A server stores a cookie with <code>Set-Cookie</code>, which keeps you logged in. A stolen cookie can hijack your session.</p>`,[["Which header sets a cookie?",["set-cookie"]],["Which header identifies your browser?",["user-agent"]]]);
ad("How Websites Work","Seeing the source",`<p>Right-click and choose <b>View source</b> to read a page's HTML. Tags such as <code>&lt;a&gt;</code> (link) and <code>&lt;img&gt;</code> (image) build the page. Anyone can read front-end code, so never hide secrets there.</p>`,[["Which tag makes a link?",["a","<a>"]],["Can visitors read a page's front-end code? (yes/no)",["yes"]]]);
ad("Putting it all together","Where attackers look",`<p>Every step can be attacked: DNS spoofing, sniffing unencrypted traffic, stealing cookies, or exploiting the back end. <b>HTTPS</b> encrypts traffic so someone on the same Wi-Fi can't read it.</p>`,[["What protects web traffic from being read on shared Wi-Fi?",["https","encryption"]],["Stealing which item can hijack a logged-in session?",["cookie","cookies","session cookie"]]]);

ad("Cryptography Concepts","HTTPS in practice",`<p>A <b>certificate</b> proves a site's identity. TLS uses asymmetric crypto to agree on a key, then fast <b>symmetric</b> crypto to protect the actual data.</p>`,[["Which proves a website's identity?",["certificate","a certificate","tls certificate"]],["Which type protects the bulk data in TLS?",["symmetric"]]]);
